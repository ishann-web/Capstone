<!DOCTYPE html>
<html>
  <head>
    <style>
      p{
        font-family: arial;
      }
      .mario{
        width: 200px;
        border-radius: 20px;
      }
      .luigi{
        width: 100px;
        height: 100px;
        object-position: center;
        border-color: red;
      }
      .toad{
        height: 100px;
        width: 100px;
        object-fit: cover;
        object-position: center;
        border-radius: 100%;
        border-color: red;
        border-width: 2px;
        border-style: solid;
      }
      .search{
        border-style: none;
        border-radius: 90px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, .15);
      }
    </style>
  </head>
  <body>
    <img class="mario" src="/images.jpg" >
    <img class="luigi" src="/images.jpg">
    <img class="toad" src="/images.jpg">
    <input class=" search" type="text" placeholder="search">
    <p>
      Email
    </p>
    <input type="text" placeholder="target">

  </body>
</html>
