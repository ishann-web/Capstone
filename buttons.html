<style>
  .subscribe-button {
    background-color: rgb(165, 0, 0);
    color: white;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-right: 8px;
    margin-left: 20px;
    transition: opacity .15s;
    vertical-align: top;
  }

  .subscribe-button:hover{
    opacity: .8;
  }


  .subscribe-button:active{
    opacity: .5;
  }



  .Join{
    background-color: white;
    border-color: rgb(6, 95, 212);
    border-style: solid;
    border-width: 1px;
    color: rgb(6, 95, 212);
    padding-top: 9px;
    padding-bottom: 9px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color .15s,
      color .15s;
  }

  .Join:hover{
    background-color: rgb(6, 95, 212);
    color:white;
  }
  
  .Join:active{
    opacity: .7;
  }

  .Tweet{
    background-color: rgb(29, 155, 240);
    color: white;
    border: none;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 16px;
    padding-right: 16px;
    border-radius: 18px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    transition: box-shadow .15s;
    vertical-align: top;
  }

  .Tweet:hover{
    box-shadow: 5px 5px 10px rgba(0, 0, 0, .15);
  }

</style>

<button class="subscribe-button">
  Subscribe
</button>
<button class="Join">
  Join 
</button>
<button class="Tweet">
  Tweet
</button>
